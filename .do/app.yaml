# DigitalOcean App Platform spec for Space Works Bookings.
# Guide: docs/DEPLOYMENT_CLOUD.md ("DigitalOcean App Platform").
#
#   doctl apps create --spec .do/app.yaml           (first time)
#   doctl apps update <app-id> --spec .do/app.yaml  (later)
#
# Before creating the app:
#   1. A managed PostgreSQL 16 cluster named swbook-db in the same region, with a
#      database swbook and user swbook. Bound below as ${db.DATABASE_URL}, which
#      already carries ?sslmode=require.
#   2. A managed Valkey (Redis-compatible) cluster with eviction policy noeviction;
#      copy its rediss:// URI into REDIS_URL.
#   3. A private Spaces bucket and a Spaces access key limited to it.
#   4. A published release tag (REPLACE_WITH_IMMUTABLE_RELEASE). While the GHCR packages
#      are private, add registry_credentials ("<github-user>:<token with read:packages>")
#      to each image block.
# Replace every CHANGE_ME, then set the SECRET values in the control panel or with
# doctl (never commit real values to this file). The web service, the migration job,
# the worker and beat run the same image and release.
name: spaceworks-bookings
region: blr

services:
  - name: web
    image:
      registry_type: GHCR
      registry: spaceworks-labs
      repository: spaceworks-bookings-backend
      tag: REPLACE_WITH_IMMUTABLE_RELEASE
    run_command: docker-entrypoint.sh --role backend node server.js
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-2gb
    instance_count: 1
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 15

jobs:
  # Runs before every deployment; a failed migration stops the rollout.
  - name: migrate
    kind: PRE_DEPLOY
    image:
      registry_type: GHCR
      registry: spaceworks-labs
      repository: spaceworks-bookings-backend
      tag: REPLACE_WITH_IMMUTABLE_RELEASE
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: docker-entrypoint.sh --role migrate

workers:
  # BullMQ: the worker runs queued jobs (email outbox, payment checks, retention),
  # beat keeps the job schedules in Redis. Both serve /health on 3460 inside the container.
  - name: worker
    image:
      registry_type: GHCR
      registry: spaceworks-labs
      repository: spaceworks-bookings-backend
      tag: REPLACE_WITH_IMMUTABLE_RELEASE
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    run_command: docker-entrypoint.sh --role worker node dist/worker.js
  - name: beat
    image:
      registry_type: GHCR
      registry: spaceworks-labs
      repository: spaceworks-bookings-backend
      tag: REPLACE_WITH_IMMUTABLE_RELEASE
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    run_command: docker-entrypoint.sh --role beat node dist/beat.js

databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: swbook-db
    db_name: swbook
    db_user: swbook

# App-wide variables, shared by the web service, the migration job, the worker and beat.
envs:
  - key: NODE_ENV
    value: production
    scope: RUN_TIME
  - key: DATABASE_URL
    value: ${db.DATABASE_URL}
    scope: RUN_TIME
  - key: NEXT_PUBLIC_BASE_URL
    value: https://CHANGE_ME.example.org
    scope: RUN_TIME
  - key: AUTH_URL
    value: https://CHANGE_ME.example.org
    scope: RUN_TIME
  - key: SUPER_ADMIN_EMAIL
    value: CHANGE_ME@example.org
    scope: RUN_TIME
  - key: REDIS_URL
    type: SECRET
    scope: RUN_TIME
  # `openssl rand -base64 48` for the three bearer/session secrets,
  # `openssl rand -base64 32` for the three keys. Keep copies in a password manager.
  - key: AUTH_SECRET
    type: SECRET
    scope: RUN_TIME
  - key: CRON_SECRET
    type: SECRET
    scope: RUN_TIME
  - key: HEALTHCHECK_SECRET
    type: SECRET
    scope: RUN_TIME
  - key: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    type: SECRET
    scope: RUN_TIME
  - key: MFA_ENCRYPTION_KEY
    type: SECRET
    scope: RUN_TIME
  - key: PAYMENT_SECRETS_KEY
    type: SECRET
    scope: RUN_TIME
  # App Platform's edge appends the client address to X-Forwarded-For.
  - key: TRUSTED_PROXY_IP_HEADER
    value: x-forwarded-for
    scope: RUN_TIME
  - key: TRUSTED_PROXY_HOPS
    value: "1"
    scope: RUN_TIME
  # DigitalOcean Spaces (private bucket).
  - key: S3_BUCKET
    value: CHANGE_ME
    scope: RUN_TIME
  - key: S3_REGION
    value: blr1
    scope: RUN_TIME
  - key: S3_ENDPOINT
    value: https://blr1.digitaloceanspaces.com
    scope: RUN_TIME
  - key: S3_FORCE_PATH_STYLE
    value: "1"
    scope: RUN_TIME
  - key: S3_ACCESS_KEY_ID
    type: SECRET
    scope: RUN_TIME
  - key: S3_SECRET_ACCESS_KEY
    type: SECRET
    scope: RUN_TIME
  # Outgoing email (Super admin -> Settings overrides it).
  - key: EMAIL_FROM
    value: Space Works Bookings <bookings@CHANGE_ME.example.org>
    scope: RUN_TIME
  - key: SMTP_HOST
    value: smtp-relay.brevo.com
    scope: RUN_TIME
  - key: SMTP_PORT
    value: "587"
    scope: RUN_TIME
  - key: SMTP_SECURE
    value: "false"
    scope: RUN_TIME
  - key: SMTP_USER
    type: SECRET
    scope: RUN_TIME
  - key: SMTP_PASSWORD
    type: SECRET
    scope: RUN_TIME
  - key: JOBS_QUEUE_PREFIX
    value: "swb:jobs"
    scope: RUN_TIME
  - key: JOBS_HEALTH_PORT
    value: "3460"
    scope: RUN_TIME
  - key: JOBS_INPROCESS
    value: "false"
    scope: RUN_TIME
